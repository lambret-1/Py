name: 渲染 JSON 为剧本报告

on:
  push:
    branches:
      - main
    paths:
      - '01_剧本数据/**.json'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Node.js 环境
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 执行渲染
      run: |
        set +e
        mkdir -p 剧本
        
        echo "======================================="
        echo "正在扫描 01_剧本数据 下的所有 JSON..."
        
        # 1. 提取所有文件名，去掉后缀，并去重，存入临时文件
        ls 01_剧本数据/*.json 2>/dev/null | xargs -n 1 basename 2>/dev/null | sed -E 's/-(outline|cast|art|script|storyboard)\.json$//' | sort -u > books_list.txt
        
        if [ ! -s books_list.txt ]; then
          echo "❌ 错误：在 01_剧本数据 里没有找到任何 JSON 文件！"
          exit 1
        fi
        
        echo "发现以下项目："
        cat books_list.txt
        echo "======================================="
        
        # 2. 遍历去重后的书名
        while IFS= read -r BOOK_NAME; do
          # 忽略空行
          [ -z "$BOOK_NAME" ] && continue
          
          echo "======================================="
          echo "正在处理项目: $BOOK_NAME"
          
          OUTLINE_FILE="01_剧本数据/${BOOK_NAME}-outline.json"
          CAST_FILE="01_剧本数据/${BOOK_NAME}-cast.json"
          ART_FILE="01_剧本数据/${BOOK_NAME}-art.json"
          SCRIPT_FILE="01_剧本数据/${BOOK_NAME}-script.json"
          STORYBOARD_FILE="01_剧本数据/${BOOK_NAME}-storyboard.json"

          # 1. 渲染大纲
          if [ -f "$OUTLINE_FILE" ]; then
            echo "--- [1/5] 渲染大纲 ---"
            node 02_核心代码/novel-outline.mjs render "$OUTLINE_FILE" --md > "剧本/${BOOK_NAME}_大纲.md" || echo "❌ 大纲(MD)渲染报错"
            node 02_核心代码/novel-outline.mjs render "$OUTLINE_FILE" --html > "剧本/${BOOK_NAME}_大纲报告.html" || echo "❌ 大纲(HTML)渲染报错"
          fi

          # 2. 渲染角色
          if [ -f "$CAST_FILE" ]; then
            echo "--- [2/5] 渲染角色 ---"
            node 02_核心代码/novel-characters.mjs render "$CAST_FILE" --md > "剧本/${BOOK_NAME}_角色设定.md" || echo "❌ 角色(MD)渲染报错"
            node 02_核心代码/novel-characters.mjs render "$CAST_FILE" --html > "剧本/${BOOK_NAME}_角色报告.html" || echo "❌ 角色(HTML)渲染报错"
          fi

          # 3. 渲染美术
          if [ -f "$ART_FILE" ]; then
            echo "--- [3/5] 渲染美术 ---"
            node 02_核心代码/novel-art.mjs render "$ART_FILE" --md > "剧本/${BOOK_NAME}_美术设定.md" || echo "❌ 美术(MD)渲染报错"
            node 02_核心代码/novel-art.mjs render "$ART_FILE" --html > "剧本/${BOOK_NAME}_美术报告.html" || echo "❌ 美术(HTML)渲染报错"
          fi

          # 4. 渲染剧本
          if [ -f "$SCRIPT_FILE" ]; then
            echo "--- [4/5] 渲染剧本 ---"
            ARGS=""
            [ -f "$OUTLINE_FILE" ] && ARGS="$ARGS --outline $OUTLINE_FILE"
            [ -f "$ART_FILE" ] && ARGS="$ARGS --art $ART_FILE"
            
            node 02_核心代码/novel-script.mjs render "$SCRIPT_FILE" --md $ARGS > "剧本/${BOOK_NAME}_剧本.md" || echo "❌ 剧本(MD)渲染报错"
            node 02_核心代码/novel-script.mjs render "$SCRIPT_FILE" --html $ARGS > "剧本/${BOOK_NAME}_剧本报告.html" || echo "❌ 剧本(HTML)渲染报错"
          fi

          # 5. 渲染分镜
          if [ -f "$STORYBOARD_FILE" ]; then
            echo "--- [5/5] 渲染分镜 ---"
            ARGS=""
            [ -f "$SCRIPT_FILE" ] && ARGS="$ARGS --script $SCRIPT_FILE"
            [ -f "$OUTLINE_FILE" ] && ARGS="$ARGS --outline $OUTLINE_FILE"
            [ -f "$ART_FILE" ] && ARGS="$ARGS --art $ART_FILE"
            
            node 02_核心代码/novel-storyboard.mjs render "$STORYBOARD_FILE" --md $ARGS > "剧本/${BOOK_NAME}_分镜表.md" || echo "❌ 分镜(MD)渲染报错"
            node 02_核心代码/novel-storyboard.mjs render "$STORYBOARD_FILE" --html $ARGS > "剧本/${BOOK_NAME}_分镜报告.html" || echo "❌ 分镜(HTML)渲染报错"
          fi
        done < books_list.txt
        
        rm books_list.txt
        
        echo "======================================="
        echo "生成的剧本文件如下："
        ls -lh 剧本/
        echo "======================================="

    - name: 将报告打包为下载附件 (防丢失)
      uses: actions/upload-artifact@v4
      with:
        name: 剧本渲染报告
        path: 剧本/
        if-no-files-found: warn

    - name: 提交并推送生成的报告
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-generated: 更新渲染报告 [skip ci]"
        file_pattern: '剧本/*'